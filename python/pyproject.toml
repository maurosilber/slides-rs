[project]
name = "slides-rs"
version = "0.1.0"
description = "Steps for the figures of a slides-rs deck, as matplotlib's gid."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "matplotlib",
  "numpy",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = ["--doctest-modules"]
testpaths = ["src", "tests"]
