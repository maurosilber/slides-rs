[project]
name = "slides-rs"
version = "0.1.0"
description = "Steps for the figures of a slides-rs deck, as matplotlib's gid."
requires-python = ">=3.10"
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slides_rs"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
# The examples in the docstrings are tests too.
addopts = ["--doctest-modules"]
