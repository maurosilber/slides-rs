[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["osx-arm64"]

[environments]
lint = { features = ["lint"], no-default-feature = true }
python = { features = ["python"], no-default-feature = true }

[dependencies]
rust = "*"
rust-src = "*"

[feature.lint.dependencies]
lefthook = "*"
ruff = "*"
taplo = "*"
typos = "*"

[feature.lint.tasks]
lefthook = { cmd = "lefthook", description = "Run lefthook" }

[feature.python.dependencies]
ipykernel = "*"

[tasks.run]
cmd = "cargo run"
env = { JUPYTER_PATH = "/Users/maurosilber/git/slides-rs/.pixi/envs/python/share/jupyter" }
