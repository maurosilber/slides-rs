[workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]
preview = ["pixi-build"]

[package]
name = "slides-rs"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-rust", version = "*" }
config.env = { CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP = "false" }
# With the MACOSX_DEPLOYMENT_TARGET of the build, the strip of a release leaves
# proc-macros that macOS refuses to load, so those are left unstripped.

[package.run-dependencies]
slides-rs-python = { path = "python" }

[tasks]
python-test = { cmd = "cargo build --quiet && pytest python", description = "Test the Python package, drawing a figure with slides-rs" }

[environments]
default = ["rust", "python"]
python = ["python"]
# The python feature holds the kernels the extension's tests run cells on.
vscode = ["rust", "python", "vscode"]

[feature.rust.dependencies]
rust = "*"
rust-src = "*"
sccache = "*"

[feature.python.dependencies]
python = "*"
matplotlib = "*"
ipykernel = "*"
xeus-python = "*"
pytest = "*"
slides-rs-python = { path = "python" }

[feature.vscode.dependencies]
nodejs = "*"
rust-std-wasm32-wasip1-threads = "*"

[feature.vscode.tasks]
vscode-deps = { cmd = "npm install", cwd = "vscode" }
vscode-build = { cmd = "npm run build", cwd = "vscode", depends-on = ["vscode-deps"] }
vscode-dev = { cmd = "\"$VSCODE\" --extensionDevelopmentPath=\"$PIXI_PROJECT_ROOT/vscode\" \"$PIXI_PROJECT_ROOT/example\"", depends-on = ["vscode-build"], description = "Open the example deck in a VS Code window running the extension" }
vscode-test = { cmd = "npm test", cwd = "vscode", depends-on = ["vscode-build"], description = "Test the extension in a VS Code of its own" }
vscode-install = { cmd = "npm run package -- --out slides-notebook.vsix && python install.py \"$VSCODE\" slides-notebook.vsix \"$PIXI_PROJECT_ROOT\"", cwd = "vscode", depends-on = ["vscode-build"], description = "Package the extension and install it in the VS Code profile this project opens with" }

[feature.vscode.activation.env]
VSCODE = "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code"
