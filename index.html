<html>

<head>
    <style>
        section {
            width: 100%;
            height: 100%;
            display: none;
        }

        /* H3 sections become columns; the H2 spans them all. */
        section {
            column-count: 1;

            &:has(h3:nth-of-type(2)) { column-count: 2 }
            &:has(h3:nth-of-type(3)) { column-count: 3 }
            &:has(h3:nth-of-type(4)) { column-count: 4 }

            &>h2 {
                column-span: all;
            }

            &>h3:not(:first-of-type) {
                break-before: column;
            }
        }
    </style>
</head>

<body>
    <section>
        <h2>H2</h2>
        
        <h3>Column 1</h3>
        <p>Column text</p>
        <h3>Column 2</h3>
        <p>Column text</p>
        <h3>Column 3</h3>
        <p>Column text</p>
        <h3>Column 4</h3>
        <p>Column text</p>
        <h3>Column 5</h3>
        <p>Column text</p>
        
        <h2>H2</h2>
        
        <h3>Column 1</h3>
        <p>Column text</p>
        <h3>Column 2</h3>
        <p>Column text</p>
        <h3>Column 3</h3>
        <p>Column text</p>
        <h3>Column 4</h3>
        <p>Column text</p>
        <h3>Column 5</h3>
        <p>Column text</p>
    </section>
    <section>Chau</section>
</body>

<script>
    const slides = document.getElementsByTagName("section");

    let currentSlide = 0;
    slides[currentSlide].style.display = "block";

    function updateSlide(i) {
        if (i < 0 || i >= slides.length) return;
        slides[i].style.display = "block"
        slides[currentSlide].style.display = "none";
        currentSlide = i;
    }

    addEventListener("keydown", (event) => {
        if (event.code == "ArrowRight") {
            updateSlide(currentSlide + 1)
        } else if (event.code == "ArrowLeft") {
            updateSlide(currentSlide - 1)
        } else {
            console.log(event)
        }
    })
</script>

</html>
