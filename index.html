<html>

<head>
    <style>
        section {
            width: 100%;
            height: 100%;
            display: none;
        }

        /* H3 sections become columns; the H2 spans them all. */
        section {
            column-count: var(--cols, 1);

            &>h2 {
                column-span: all;
            }

            &>h3:not(:first-of-type) {
                break-before: column;
            }
        }
    </style>
</head>

<body>
    <section>
        <h2>H2</h2>

        <h3>Column 1</h3>
        <p>Column text</p>
        <h3>Column 2</h3>
        <p>Column text</p>
        <h3>Column 3</h3>
        <p>Column text</p>
        <h3>Column 4</h3>
        <p>Column text</p>
        <h3>Column 5</h3>
        <p>Column text</p>

        <h2>H2</h2>

        <h3>Column 1</h3>
        <p>Column text</p>
        <h3>Column 2</h3>
        <p>Column text</p>
        <h3>Column 3</h3>
        <p>Column text</p>
        <h3>Column 4</h3>
        <p>Column text</p>
    </section>
    <section>
        <h2>H2</h2>

        <h3>Column 1</h3>
        <p>Column text</p>
        <h3>Column 2</h3>
        <p>Column text</p>
    </section>
</body>

<script>
    const slides = document.getElementsByTagName("section");

    // Each h3 starts a column and owns the elements up to the next h3 or h2.
    // The h2s are spanners, so they stay visible and reset the column run.
    const fragments = [...slides].map((slide) => {
        const columns = [];
        let column = null;
        for (const child of slide.children) {
            if (child.tagName == "H2") {
                column = null;
            } else if (child.tagName == "H3") {
                column = [];
                columns.push(column);
            }
            column?.push(child);
        }
        return columns;
    });

    // column-count has to fit the widest h2 group, not the whole slide.
    for (const slide of slides) {
        let widest = 0, run = 0;
        for (const child of slide.children) {
            if (child.tagName == "H2") run = 0;
            else if (child.tagName == "H3") widest = Math.max(widest, ++run);
        }
        slide.style.setProperty("--cols", widest || 1);
    }

    let currentSlide = 0;
    let currentFragment = 0;
    slides[currentSlide].style.display = "block";

    function updateSlide(i, fragment = 0) {
        if (i < 0 || i >= slides.length) return;
        slides[i].style.display = "block"
        slides[currentSlide].style.display = "none";
        currentSlide = i;
        updateFragment(Math.min(fragment, fragments[i].length));
    }

    // Hidden rather than removed, so the columns keep their place.
    function updateFragment(i) {
        const columns = fragments[currentSlide];
        if (i < 0 || i > columns.length) return false;
        columns.forEach((column, j) => {
            for (const element of column) {
                element.style.visibility = j < i ? "visible" : "hidden";
            }
        });
        currentFragment = i;
        return true;
    }

    updateFragment(0);

    addEventListener("keydown", (event) => {
        if (event.code == "ArrowRight") {
            if (!updateFragment(currentFragment + 1)) updateSlide(currentSlide + 1)
        } else if (event.code == "ArrowLeft") {
            if (!updateFragment(currentFragment - 1)) updateSlide(currentSlide - 1, Infinity)
        } else if (event.code == "ArrowDown") {
            updateSlide(currentSlide + 1)
        } else if (event.code == "ArrowUp") {
            updateSlide(currentSlide - 1)
        } else {
            console.log(event)
        }
    })
</script>

</html>
