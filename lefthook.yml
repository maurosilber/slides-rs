lefthook: pixi run --no-progress lefthook

templates:
  default: run --quiet --no-progress --environment=default
  lint: run --quiet --no-progress --environment=lint

colors: true

output:
  - meta # Print lefthook version
  - summary # Print summary block (successful and failed steps)
  - empty_summary # Print summary heading when there are no steps to run
  # - success # Print successful steps
  # - failure # Print failed steps printing
  # - execution # Print any execution logs
  # - execution_out # Print execution output
  # - execution_info # Print `EXECUTE > ...` logging
  - skips # Print "skip" (i.e. no files matched)

pre-commit:
  parallel: true
  jobs:
    - name: cargo-fmt
      glob: "*.rs"
      stage_fixed: true
      run: pixi {default} cargo fmt --all
    - name: ruff
      glob: "*.{py,pyi}"
      stage_fixed: true
      group:
        piped: true
        jobs:
          - name: ruff lint
            run: pixi {lint} ruff check --fix --exit-non-zero-on-fix --force-exclude {staged_files}
          - name: ruff format
            run: pixi {lint} ruff format --exit-non-zero-on-format {staged_files}
    - name: taplo
      stage_fixed: true
      glob: "*.toml"
      exclude:
        - schema/examples/invalid/*.toml
      run: pixi {lint} taplo fmt {staged_files}
    - name: typos
      stage_fixed: true
      run: pixi {lint} typos --force-exclude

pre-push:
  jobs:
    - name: cargo-clippy
      glob: "*.rs"
      run: pixi {default} cargo clippy --all-targets --workspace -- -D warnings
