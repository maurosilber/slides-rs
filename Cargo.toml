[package]
name = "slides-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
jupyter-protocol = "2.0.2"
jupyter-zmq-client = { version = "1.0.1", features = ["tokio-runtime"] }
notify = "8.2.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
quick-xml = "0.42.0"
ruff_python_ast = "0.0.15"
ruff_python_parser = "0.0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time", "net"] }
uuid = { version = "1.26.1", features = ["v4"] }
