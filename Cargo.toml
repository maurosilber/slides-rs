[package]
name = "slides-rs"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["vscode/wasm"]

# The library is what the command line and the VS Code extension share: the
# markdown, the address of every cell and the outputs saved under it. The
# command line runs the cells too, which the extension's WebAssembly cannot.
[lib]
name = "slides"

[[bin]]
name = "slides-rs"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = [
    "dep:base64",
    "dep:clap",
    "dep:indicatif",
    "dep:jupyter-protocol",
    "dep:jupyter-zmq-client",
    "dep:notify",
    "dep:quick-xml",
    "dep:serde_json",
    "dep:tokio",
]

[dependencies]
anyhow = "1.0.104"
base64 = { version = "0.23.1", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
indicatif = { version = "0.18.6", optional = true }
jupyter-protocol = { version = "2.0.2", optional = true }
jupyter-zmq-client = { version = "1.0.1", features = ["tokio-runtime"], optional = true }
notify = { version = "8.2.0", optional = true }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
quick-xml = { version = "0.42.0", optional = true }
ruff_python_ast = "0.0.15"
ruff_python_parser = "0.0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.151", optional = true }
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time", "net", "process", "signal", "sync", "io-std", "io-util"], optional = true }
uuid = { version = "1.26.1", features = ["v4"] }

# Dependencies build without debug info, which cuts a clean build by a tenth.
# Backtraces still name their functions, without file and line.
[profile.dev.package."*"]
debug = false

# Hashing the files the cells read is most of a render that runs no cell,
# and is several times slower unoptimized.
[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
schemars = "1.2.2"
serde_json = "1.0.151"
