[package]
name = "slides-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
jupyter-protocol = "2.0.2"
jupyter-zmq-client = { version = "1.0.1", features = ["tokio-runtime"] }
notify = "8.2.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time"] }
uuid = { version = "1.26.1", features = ["v4"] }
