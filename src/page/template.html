<!DOCTYPE html>
<html{root}>

<head>
    <meta charset="UTF-8">
    {styles}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.min.css"
        integrity="sha384-JctiRyLzXCrSoOOzFlSoWLdyzQl7OrrRnhyeBmzB6ZWtcjccUyc8lCQJqIbs3uQX" crossorigin="anonymous">
    <script type="module">
        import katex from "https://cdn.jsdelivr.net/npm/katex@0.18.7/dist/katex.mjs";
        const options = {
            throwOnError: false,
            // \htmlStyle and \htmlClass carry the steps out to the page, as
            // the deck writes every \step{...} and \also{...}, and \htmlData
            // those of slides whose steps are off. They are the only commands
            // allowed to write html.
            trust: (context) => ["\\htmlData", "\\htmlStyle", "\\htmlClass"].includes(context.command),
        };
        // The markdown leaves math as its TeX, in a span of its own.
        for (const math of document.querySelectorAll(".math")) {
            katex.render(math.textContent, math, {
                ...options,
                displayMode: math.classList.contains("math-display"),
            });
        }
    </script>
    <script type="module">
        import hljs from "https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/es/highlight.min.js";
        // The markdown names a block's language in its class; the theme
        // colours the tokens, so no stylesheet of highlight.js is linked.
        for (const code of document.querySelectorAll('pre > code[class^="language-"]')) {
            const language = code.className.match(/language-(\S+)/)[1];
            if (hljs.getLanguage(language)) {
                hljs.highlightElement(code);
            }
        }
    </script>
</head>

<body>
{body}
</body>

{script}

</html>
