[package]
name = "slides-notebook"
version = "0.1.0"
edition = "2024"
publish = false

# Runs under WASI in the VS Code extension, which has no kernel to run the
# cells on, so it takes the library alone.
[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slides-rs = { path = "../..", default-features = false }
